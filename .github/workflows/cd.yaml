name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            lachheb/biscuitimport:v1

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull the new image
            docker pull lachheb/biscuitimport:v1
            
            # Stop and remove the old container (if it exists)
            docker stop backend || true
            docker rm backend || true
            
            # Run the new container
            docker run -d \
              --name backend \
              --restart unless-stopped \
              -v /srv/biscuitimport/db:/app/src/database \
              -v /srv/biscuitimport/uploads:/app/uploads \
              -e PORT=${{ secrets.PORT }} \
              -e NODE_ENV=${{ secrets.NODE_ENV }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }} \
              -e LOG_LEVEL=${{ secrets.LOG_LEVEL }} \
              -e BASE_URL=${{ secrets.BASE_URL }} \
              -p 3000:3000 \
              lachheb/biscuitimport:v1
                